
openapi: 3.0.3

info:
  title: Task Management API
  version: 1.0.0
  description: >
    REST API for managing projects and tasks.
    This API specification describes CRUD operations,
    request parameters, response schemas, authentication
    and common error responses.
  contact:
    name: Artem Demchenko

servers:
  - url: https://api.example.com/v1
    description: Example server URL. Replace with a real API URL when available.

tags:
  - name: Projects
    description: Operations for project management
  - name: Tasks
    description: Operations for task management

security:
  - BearerAuth: []

paths:
  /projects:
    get:
      tags: [Projects]
      summary: Get all projects
      operationId: getProjects
      security: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of projects to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of projects to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
              example:
                - id: 1
                  name: Website Redesign
                  description: Redesign the company website
                  createdAt: "2026-10-20T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
            example:
              name: Website Redesign
              description: Redesign the company website
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                id: 1
                name: Website Redesign
                description: Redesign the company website
                createdAt: "2026-10-20T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Unique project identifier
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Projects]
      summary: Get a project by ID
      operationId: getProjectById
      security: []
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Projects]
      summary: Update a project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
            example:
              name: Updated Website
              description: Updated project description
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Projects]
      summary: Delete a project
      operationId: deleteProject
      responses:
        "204":
          description: Project deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks
      operationId: getTasks
      security: []
      parameters:
        - name: projectId
          in: query
          required: false
          description: Filter tasks by project ID
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          description: Filter tasks by status
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
              example:
                - id: 10
                  projectId: 1
                  title: Create homepage
                  description: Implement the homepage layout
                  status: in_progress
                  priority: high
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Tasks]
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
            example:
              projectId: 1
              title: Create homepage
              description: Implement the homepage layout
              status: todo
              priority: high
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        description: Unique task identifier
        schema:
          type: integer
          minimum: 1

    get:
      tags: [Tasks]
      summary: Get a task by ID
      operationId: getTaskById
      security: []
      responses:
        "200":
          description: Task found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Tasks]
      summary: Update a task
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      responses:
        "204":
          description: Task deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide a valid JWT access token in the Authorization header.

  schemas:
    Project:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Website Redesign
        description:
          type: string
          maxLength: 1000
          example: Redesign the company website
        createdAt:
          type: string
          format: date-time
          example: "2026-10-20T10:00:00Z"

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000

    Task:
      type: object
      required: [id, projectId, title, status, priority]
      properties:
        id:
          type: integer
          example: 10
        projectId:
          type: integer
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 150
          example: Create homepage
        description:
          type: string
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"

    TaskInput:
      type: object
      required: [projectId, title, status, priority]
      properties:
        projectId:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"

    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
      example: todo

    TaskPriority:
      type: string
      enum: [low, medium, high]
      example: high

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Resource not found

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: BAD_REQUEST
            message: Request parameters are invalid

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: Authentication is required

    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Project or task was not found

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL_ERROR
            message: An unexpected error occurred
